name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Initialize IRC test submodule
        run: git submodule update --init acquisition/irc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit==2.10.1
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -v
