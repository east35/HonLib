name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Initialize IRC test submodule
        run: git submodule update --init acquisition/irc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -v

  scripted-epub:
    name: Scripted EPUB (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize Foliate
        run: git submodule update --init static/vendor/foliate-js
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test scripted EPUB containment
        env:
          HONLIB_BROWSER: ${{ matrix.browser }}
        run: npm run test:scripted-epub
