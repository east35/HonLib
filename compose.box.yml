# Homelab deployment (this box) — overrides the repo's default docker-compose.yml.
# Use:  docker compose -f compose.box.yml up -d --build   (or ./update.sh)
# Ingress: cloudflared *.razerblade.dev -> traefik:80 -> this container:8765.
# Library + staging live on the NAS via NFS; config is local.
# Replaces the old east35/ebook-library deployment on honlib.razerblade.dev.
services:
  honlib:
    build: .
    container_name: honlib
    restart: unless-stopped
    # Fedora SELinux is Enforcing; NFS bind mounts can't carry container labels.
    security_opt:
      - label:disable
    volumes:
      - /home/Admin/srv/mounts/nas-media/books/ebooks-dl:/data/books
      - /home/Admin/srv/mounts/nas-media/books/staging:/data/staging
      - ./config:/data/config
    environment:
      EBOOK_LIB_NO_BROWSER: "1"
      EBOOK_LIB_FOLDER: /data/books
      EBOOK_LIB_STAGING: /data/staging
      EBOOK_LIB_CONFIG_DIR: /data/config
      EBOOK_LIB_CONTAINER: "1"
      # IRC acquisition plugin (acquisition/irc submodule -> HonLib-IRC)
      EBOOK_LIB_IRC_NICK: ${EBOOK_LIB_IRC_NICK:-ebooklib}
      EBOOK_LIB_IRC_SERVER: ${EBOOK_LIB_IRC_SERVER:-irc.irchighway.net}
      EBOOK_LIB_IRC_CHANNEL: ${EBOOK_LIB_IRC_CHANNEL:-#ebooks}
      EBOOK_LIB_PASSWORD: ${EBOOK_LIB_PASSWORD:-}
      EBOOK_LIB_USERNAME: ${EBOOK_LIB_USERNAME:-}
      EBOOK_LIB_COOKIE_SECURE: ${EBOOK_LIB_COOKIE_SECURE:-1}
      # Cover-search providers (Google Books / Programmable Search / Hardcover)
      EBOOK_LIB_GOOGLE_BOOKS_API_KEY: ${EBOOK_LIB_GOOGLE_BOOKS_API_KEY:-}
      EBOOK_LIB_GOOGLE_CSE_API_KEY: ${EBOOK_LIB_GOOGLE_CSE_API_KEY:-}
      EBOOK_LIB_GOOGLE_CSE_CX: ${EBOOK_LIB_GOOGLE_CSE_CX:-}
      EBOOK_LIB_HARDCOVER_API_KEY: ${EBOOK_LIB_HARDCOVER_API_KEY:-}
      EBOOK_LIB_HARDCOVER_GRAPHQL_URL: ${EBOOK_LIB_HARDCOVER_GRAPHQL_URL:-}
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.honlib.entrypoints=web
      - traefik.http.routers.honlib.rule=Host(`honlib.razerblade.dev`)
      - traefik.http.services.honlib.loadbalancer.server.port=8765

networks:
  proxy:
    external: true
